---
- name: Look up selected VMs by name
  vmware.vmware_rest.vcenter_vm_info:
    filter_names: "{{ user_selected_vm_names.split('\n') | select | list }}"
  register: selected_vms

- name: Display matched VMs
  ansible.builtin.debug:
    msg: "VM Name: {{ item.name }}, VM ID: {{ item.vm }}"
  loop: "{{ selected_vms.value }}"
  loop_control:
    label: "{{ item.name }}"

- name: Prepare VMs for Plan spec
  ansible.builtin.set_fact:
    vms_for_plan_spec: >-
      {% set vms = [] -%}
      {% for vm in selected_vms.value -%}
        {{ vms.append({'id': vm.vm, 'name': vm.name}) | default('', true) -}}
      {% endfor -%}
      {{ vms }}

- name: List disks for each selected VM
  vmware.vmware_rest.vcenter_vm_hardware_disk_info:
    vm: "{{ item.vm }}"
  register: vm_disk_lists
  loop: "{{ selected_vms.value }}"
  loop_control:
    label: "{{ item.name }}"

- name: Build list of VM/disk pairs to query
  ansible.builtin.set_fact:
    vm_disk_pairs: >-
      {% set pairs = [] -%}
      {% for result in vm_disk_lists.results -%}
        {% for disk in result.value -%}
          {{ pairs.append({'vm': result.item.vm, 'disk': disk.disk}) | default('', true) -}}
        {% endfor -%}
      {% endfor -%}
      {{ pairs }}

- name: Get disk detail for each VM/disk pair
  vmware.vmware_rest.vcenter_vm_hardware_disk_info:
    vm: "{{ item.vm }}"
    disk: "{{ item.disk }}"
  register: vm_disk_details
  loop: "{{ vm_disk_pairs }}"
  loop_control:
    label: "{{ item.vm }}:{{ item.disk }}"

- name: Extract unique datastore names from VMDK paths
  ansible.builtin.set_fact:
    datastore_names: >-
      {{ vm_disk_details.results
         | map(attribute='value') | list
         | map(attribute='backing') | map(attribute='vmdk_file')
         | map('regex_search', '^\[(.+?)\]', '\1') | map('first')
         | unique | list }}

- name: Display discovered datastores
  ansible.builtin.debug:
    msg: "Datastores: {{ datastore_names }}"

- name: Create or update a NetworkMap
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'networkmap.yaml.j2') | from_yaml }}"

- name: Get storage class information
  kubernetes.core.k8s_info:
    api_version: storage.k8s.io/v1
    kind: StorageClass
  register: storage_classes

- name: Find default storage class
  set_fact:
    default_storage_class: "{{ item.metadata.name }}"
  loop: "{{ storage_classes.resources }}"
  when:
    - item.metadata.annotations is defined
    - "'storageclass.kubernetes.io/is-default-class' in item.metadata.annotations"
    - item.metadata.annotations['storageclass.kubernetes.io/is-default-class'] == 'true'

- name: Print default storage class name
  debug:
    msg: "{{ default_storage_class }}"

- name: Create or update a StorageMap
  kubernetes.core.k8s:
    namespace: "{{ migration_namespace }}"
    definition: "{{ lookup('template', 'datastore.yaml.j2' ) | from_yaml }}"
    state: present

- name: Deploy Virt Plan
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: forklift.konveyor.io/v1beta1
      kind: Plan
      metadata:
        name: "{{ plan_name }}"
        namespace: "{{ migration_namespace }}"
      spec:
        archived: false
        description: ''
        map:
          network:
            name: "{{ networkmap_name }}"
            namespace: "{{ migration_namespace }}"
          storage:
            name: "{{ storagemap_name }}"
            namespace: "{{ migration_namespace }}"
        provider:
          destination:
            name: host
            namespace: "{{ migration_namespace }}"
          source:
            name: vmware
            namespace: "{{ migration_namespace }}"
        targetNamespace: "{{ migration_target_namespace }}"
        vms: "{{ vms_for_plan_spec }}"
        warm: false

- name: Wait for Plan to become Ready
  kubernetes.core.k8s_info:
    api_version: forklift.konveyor.io/v1beta1
    kind: Plan
    namespace: "{{ migration_namespace }}"
    name: "{{ plan_name }}"
  register: plan_status
  until: >-
    plan_status.resources | length > 0 and
    plan_status.resources[0].status.conditions | default([])
    | selectattr('type', 'equalto', 'Ready')
    | selectattr('status', 'equalto', 'True')
    | list | length > 0
  retries: 30
  delay: 10

- name: Create a Migration manifest to run the Plan CR
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: forklift.konveyor.io/v1beta1
      kind: Migration
      metadata:
        name: "{{ plan_name }}"
        namespace: "{{ migration_namespace }}"
      spec:
        plan:
          name: "{{ plan_name }}"
          namespace: "{{ migration_namespace }}"
